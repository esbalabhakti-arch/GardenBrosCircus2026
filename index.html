<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Our Garden Bros Circus Adventure — August 16, 2026</title>
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#fff8e8;color:#24180e}
    header{padding:52px 20px 38px;text-align:center;background:linear-gradient(135deg,#7d1022,#d63832);color:white}
    header .tent{font-size:54px} h1{margin:8px 0 6px;font-size:clamp(30px,6vw,58px);line-height:1.05}
    header p{margin:0;opacity:.92;font-size:18px}.wrap{max-width:1150px;margin:auto;padding:30px 18px 60px}
    .intro{text-align:center;max-width:720px;margin:0 auto 28px;font-size:17px;line-height:1.6}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px}
    .card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 5px 18px #0002}
    .card img,.card video{display:block;width:100%;height:300px;object-fit:cover;background:#111}
    .card video{object-fit:contain}.meta{padding:11px 14px;font-size:14px;color:#715746}
    footer{text-align:center;padding:30px 15px;color:#755b47}
    @media(max-width:600px){.card img,.card video{height:auto;max-height:72vh}}
  </style>
</head>
<body>
<header>
  <div class="tent">🎪</div>
  <h1>Our Garden Bros Circus Adventure</h1>
  <p>August 16, 2026</p>
</header>

<main class="wrap">
  <div class="intro">A day at the circus — photos, videos, amazing acts, and family memories.</div>
  <div id="gallery" class="grid"></div>
</main>
<footer>Made with ❤️ for our family</footer>

<script src="data.js"></script>
<script>
const gallery = document.getElementById("gallery");

albumData.forEach((item, i) => {
  const card = document.createElement("article");
  card.className = "card";

  let media;
  if (item.type === "video") {
    media = document.createElement("video");
    media.controls = true;
    media.preload = "metadata";
    media.playsInline = true;
    const source = document.createElement("source");
    source.src = item.src;
    source.type = "video/mp4";
    media.appendChild(source);
  } else {
    media = document.createElement("img");
    media.src = item.src;
    media.loading = "lazy";
    media.alt = "Circus memory " + (i + 1);
  }

  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = item.time ? "August 16, 2026 • " + item.time : "August 16, 2026";

  card.append(media, meta);
  gallery.appendChild(card);
});
</script>
</body>
</html>
